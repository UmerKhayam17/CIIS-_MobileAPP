plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.callrecording'
version = '0.1.0'

android {
  namespace "expo.modules.callrecording"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.documentfile:documentfile:1.0.1"
}
